name: Update profile images

on:
  schedule:
    - cron: "0 0 * * *" # once a day (UTC)
  workflow_dispatch: # manual run button in the Actions tab
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Prepare output folder
        run: mkdir -p dist

      # Stats, languages, streak, activity and tech badges: our own script,
      # standard library only, data from the GitHub API.
      - name: Generate cards
        run: python3 scripts/generate.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # The snake. This is the only external action; it runs once here and
      # its SVG is stored in this repo, so nothing is fetched when people view the page.
      - name: Generate snake
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg
            dist/github-snake-dark.svg?palette=github-dark

      # Push dist/ to the `output` branch with plain git (no third-party action).
      - name: Publish to output branch
        run: |
          cd dist
          git init -q
          git checkout -q -b output
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "chore: update profile images"
          git push -f "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" output
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
